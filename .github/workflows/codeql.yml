# GitHub's code scanning for security problems in the JavaScript (server and
# browser). Findings show under the repository's Security tab.
name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - vendor
              - node_modules
      - uses: github/codeql-action/analyze@v3
